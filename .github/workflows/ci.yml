name: Workflow Lint and Secret Checks

on:
  push:
    branches:
      - feature/wordpress

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub workflows
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12

      - name: Scan repository files for secrets
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact=100 --no-banner /repo
